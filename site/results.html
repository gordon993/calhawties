<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Results — Pick the Winner</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 0.9rem; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); }
    th { cursor: pointer; user-select: none; }
    .toolbar { display: flex; gap: 10px; align-items: center; margin-top: 16px; flex-wrap: wrap; }
    .login { max-width: 340px; margin: 60px auto; text-align: center; }
    .login input { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border); margin: 10px 0; background: var(--card-bg); color: var(--text); }
    .error { color: #c0392b; font-size: 0.85rem; }
  </style>
</head>
<body>
  <div class="app">
    <header class="site-header">
      <div>
        <h1>Results</h1>
        <p>Private stats. Nobody voted, everybody judged.</p>
      </div>
    </header>
    <main id="main">
      <div id="login-view" class="login">
        <p>Enter the results password.</p>
        <input type="password" id="password-input" placeholder="Password" autocomplete="current-password" />
        <button class="btn btn-primary" id="login-btn">View results</button>
        <p class="error" id="login-error"></p>
      </div>
      <div id="results-view" style="display:none">
        <div class="toolbar">
          <button class="btn" id="csv-btn">Export CSV</button>
          <button class="btn" id="refresh-btn">Refresh</button>
        </div>
        <table id="results-table">
          <thead>
            <tr>
              <th data-sort="caption">Image</th>
              <th data-sort="appearances">Appearances</th>
              <th data-sort="wins">Wins</th>
              <th data-sort="losses">Losses</th>
              <th data-sort="win_rate">Win rate</th>
              <th data-sort="championships">Championships</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </main>
  </div>
  <script type="module" src="results.js"></script>
</body>
</html>
